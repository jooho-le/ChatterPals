<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<div id="popup-view" class="container" style="display:none;">
    <div class="popup-control">
        <h3>플로팅 버튼 표시</h3>
        <label class="switch">
            <input type="checkbox" id="toggleButton">
            <span class="slider"></span>
        </label>
        <p id="statusText"></p>
    </div>
</div>

<div id="sidebar-view" class="container" style="display:none;">
    <div class="sidebar-language">
        <label for="learning-language">학습 언어</label>
        <select id="learning-language">
            <option value="en">영어</option>
            <option value="ja">일본어</option>
            <option value="zh">중국어</option>
        </select>
    </div>

    <div class="header-actions">
        <button id="close-sidebar-btn" class="close-btn" type="button" aria-label="닫기">×</button>
        <a href="http://localhost:5173/" target="_blank" rel="noreferrer noopener" class="homepage-link">홈페이지 이동</a>
    </div>

    <div class="section account-section" id="account-section">
        <div id="account-signed-in" style="display:none;">
            <p class="account-greeting">안녕하세요, <span id="account-nickname"></span>님</p>
            <button id="logoutBtn" class="btn btn-outline" type="button">로그아웃</button>
        </div>
        <form id="login-form" class="account-form" autocomplete="off">
            <h3 class="section-title">로그인</h3>
            <label class="field">
                <span>아이디</span>
                <input id="login-username" type="text" name="username" required minlength="3">
            </label>
            <label class="field">
                <span>비밀번호</span>
                <input id="login-password" type="password" name="password" required>
            </label>
            <button type="submit" class="btn btn-primary">로그인</button>
            <p id="login-status" class="hint"></p>
        </form>
    </div>

    <div id="summary-view" class="section" style="display:none;">
        <h3 class="section-title">AI 요약</h3>
        <div id="summary" class="summary-box"></div>
        <div id="topics" class="topics-box"></div>
    </div>

    <div class="section">
        <h3 class="section-title">지문 질문 생성</h3>
        <div class="row button-group">
            <button id="question" type="button">선택 텍스트 분석</button>
            <button id="analyzeAll" type="button">전체 화면 분석</button>
        </div>
        <div class="row button-group" id="analysis-choice" style="display:none;">
            <button id="start-question-flow" type="button">질문 생성하기</button>
            <button id="chatStart" type="button">AI 토론 시작</button>
        </div>
        <div class="row button-group" id="question-count-step" style="display:none;">
            <label class="inline-control">
                질문 개수
                <select id="question-count-select">
                    <option value="1">1개</option>
                    <option value="2">2개</option>
                    <option value="3" selected>3개</option>
                    <option value="4">4개</option>
                    <option value="5">5개</option>
                </select>
            </label>
            <button id="confirm-generate" class="btn btn-primary" type="button">생성</button>
            <button id="cancel-generate" class="btn btn-outline" type="button">취소</button>
        </div>
        <div class="row">
            <div id="result" class="result-box">Ready.</div>
        </div>
        <div class="row">
            <div id="questions" class="questions-container"></div>
        </div>
        <div class="row button-group" id="action-buttons" style="display:none;">
            <button id="evaluateBtn" type="button">AI 채점 받기</button>
            <button id="saveBtn" type="button" disabled>채점 결과 저장</button>
        </div>
    </div>

    <div id="chat" class="section" style="display:none;">
        <h4 class="section-title">AI 토론</h4>
        <div class="chat-meta">
            <div>세션: <code id="sid">-</code></div>
        </div>
        <div class="chat-status">AI: <span id="q">(대기중)</span></div>
        <div class="row input-group">
            <input id="answer" type="text" placeholder="답변을 입력하세요">
            <button id="send" type="button">전송</button>
        </div>
        <div class="row chat-actions">
            <button id="chatEnd" class="btn btn-danger" type="button" style="display:none;">토론 종료</button>
        </div>
        <div id="chat-evaluation" class="discussion-eval" style="display:none;">
            <h5>AI 피드백</h5>
            <div class="eval-scores">
                <span>문법: <strong id="chat-grammar-score">-</strong></span>
                <span>어휘: <strong id="chat-vocab-score">-</strong></span>
                <span>명료도: <strong id="chat-clarity-score">-</strong></span>
            </div>
            <p id="chat-feedback"></p>
        </div>
    </div>

    <hr class="divider">

    <div class="section">
        <h3 class="section-title">AI 음성 학습</h3>
        <div class="row button-group">
            <button id="recordBtn" type="button">🎤 말하기 시작</button>
        </div>
        <div class="voice-result-container">
            <p><strong>나:</strong> <span id="userTranscript">...</span></p>
            <p><strong>AI:</strong> <span id="aiResponse">...</span></p>
            <audio id="ai-audio-player" controls style="display:none;"></audio>
            <p class="voice-status"><small id="voiceStatus">버튼을 눌러 연습을 시작하세요.</small></p>
        </div>
    </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="popup.js"></script>
</body>
</html>
